name: PolyTrackIOS
options:
  bundleIdPrefix: com.red5225
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
targets:
  PolyTrackIOS:
    type: application
    platform: iOS
    sources:
      - path: PolyTrackIOS
        excludes:
          - Game/**
    resources:
      - path: PolyTrackIOS/Game
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.red5225.polytrackios
        PRODUCT_NAME: PolyTrack
        INFOPLIST_KEY_CFBundleDisplayName: PolyTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  PolyTrackMac:
    type: application
    platform: macOS
    sources:
      - path: PolyTrackMac
      - path: PolyTrackIOS/PolyTrackLocalServer.swift
    resources:
      - path: PolyTrackIOS/Game
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.red5225.polytrackmac
        PRODUCT_NAME: PolyTrack
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PolyTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
