name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download and prepare bundled PolyTrack v0.5.2
        run: bash scripts/fetch-polytrack.sh

      - name: Verify bundled game files
        run: |
          test -s PolyTrackIOS/Game/index.html
          test -s PolyTrackIOS/Game/main.bundle.js
          test -s PolyTrackIOS/Game/simulation_worker.bundle.js
          test -d PolyTrackIOS/Game/tracks
          test -d PolyTrackIOS/Game/models
          echo "Bundled game files:"
          du -sh PolyTrackIOS/Game
          find PolyTrackIOS/Game -type f | wc -l

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iPhone" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-iPhone/Build/Products/Release-iphoneos/PolyTrack.app"
          test -d "$APP_PATH"
          # Ensure the game ships as a real Game folder inside the app bundle.
          # This also handles XcodeGen resource-folder layout differences.
          mkdir -p "$APP_PATH/Game"
          ditto PolyTrackIOS/Game "$APP_PATH/Game"
          echo "Bundled game files inside app:"
          test -s "$APP_PATH/Game/index.html"
          test -s "$APP_PATH/Game/main.bundle.js"
          test -s "$APP_PATH/Game/simulation_worker.bundle.js"
          du -sh "$APP_PATH/Game"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/PolyTrack.app"
          IPA_PATH="$GITHUB_WORKSPACE/PolyTrack-Offline-v0.5.2-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"
          python3 - "$IPA_PATH" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as ipa:
              names = ipa.namelist()
              bad_file = ipa.testzip()
              if bad_file:
                  raise SystemExit(f"Corrupt IPA entry: {bad_file}")
              expected = ("Game/index.html", "Game/main.bundle.js", "Game/simulation_worker.bundle.js")
              for suffix in expected:
                  matches = [name for name in names if name.endswith(suffix)]
                  if not matches:
                      print("\n".join(names[:100]))
                      raise SystemExit(f"Missing bundled game file in IPA: {suffix}")
                  print(matches[0])
          PY
          ls -lh "$IPA_PATH"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-Simulator/Build/Products/Release-iphonesimulator/PolyTrack.app"
          test -d "$APP_PATH"
          mkdir -p "$APP_PATH/Game"
          ditto PolyTrackIOS/Game "$APP_PATH/Game"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PolyTrack-iOS-Simulator.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-Offline-v0.5.2-unsigned-IPA
          path: PolyTrack-Offline-v0.5.2-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-iOS-Simulator
          path: PolyTrack-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
