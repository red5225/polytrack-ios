name: Build iOS and macOS apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare uploaded PolyTrack v0.6.0 bundle
        run: bash scripts/fetch-polytrack.sh

      - name: Verify bundled game files
        run: |
          test -s PolyTrackIOS/Game/index.html
          test -s PolyTrackIOS/Game/main.bundle.js
          test -s PolyTrackIOS/Game/simulation_worker.bundle.js
          test -s PolyTrackIOS/Game/lib/polytrack_physics.js
          test -s PolyTrackIOS/Game/polytrack_physics.wasm
          test -s PolyTrackIOS/Game/lib/draco/draco_decoder.wasm
          test -s PolyTrackIOS/Game/lib/draco/draco_wasm_wrapper.js
          test -s PolyTrackIOS/Game/tracks/official/summer1.track
          test -s PolyTrackIOS/Game/tracks/official/winter5.track
          test -s PolyTrackIOS/Game/tracks/community/marvelous_marble.track
          test -s PolyTrackIOS/Game/models/car.glb
          test -s PolyTrackIOS/Game/.polytrack-ios-version
          grep -q '0.6.0' PolyTrackIOS/Game/main.bundle.js
          test -d PolyTrackIOS/Game/tracks
          test -d PolyTrackIOS/Game/models
          echo "Bundled game files:"
          du -sh PolyTrackIOS/Game
          find PolyTrackIOS/Game -type f | wc -l

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iPhone" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-iPhone/Build/Products/Release-iphoneos/PolyTrack.app"
          test -d "$APP_PATH"
          mkdir -p "$APP_PATH/Game"
          ditto PolyTrackIOS/Game "$APP_PATH/Game"
          test -s "$APP_PATH/Game/index.html"
          test -s "$APP_PATH/Game/main.bundle.js"
          test -s "$APP_PATH/Game/simulation_worker.bundle.js"
          test -s "$APP_PATH/Game/lib/polytrack_physics.js"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/PolyTrack.app"
          IPA_PATH="$GITHUB_WORKSPACE/PolyTrack-Offline-v0.6.0-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"
          python3 - "$IPA_PATH" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as ipa:
              names = ipa.namelist()
              bad_file = ipa.testzip()
              if bad_file:
                  raise SystemExit(f"Corrupt IPA entry: {bad_file}")
              expected = ("Game/index.html", "Game/main.bundle.js", "Game/simulation_worker.bundle.js", "Game/lib/polytrack_physics.js", "Game/polytrack_physics.wasm", "Game/tracks/official/summer1.track")
              for suffix in expected:
                  matches = [name for name in names if name.endswith(suffix)]
                  if not matches:
                      raise SystemExit(f"Missing bundled game file in IPA: {suffix}")
                  print(matches[0])
          PY
          ls -lh "$IPA_PATH"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-Simulator/Build/Products/Release-iphonesimulator/PolyTrack.app"
          test -d "$APP_PATH"
          mkdir -p "$APP_PATH/Game"
          ditto PolyTrackIOS/Game "$APP_PATH/Game"
          ditto -c -k          ditto PolyTrackIOS/Game "$APP_PATH/Game"
          test -s "$APP_PATH/Game/lib/polytrack_physics.js"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PolyTrack-iOS-Simulator-v0.6.0.zip

      - name: Build native macOS app for Monterey Intel
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackMac \
            -configuration Release \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Mac" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            build

      - name: Package native macOS app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-Mac/Build/Products/Release/PolyTrack.app"
          test -d "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/Resources/Game"
          ditto PolyTrackIOS/Game "$APP_PATH/Contents/Resources/Game"
          GAME="$APP_PATH/Contents/Resources/Game"
          FIRST_GAME="$APP_PATH/Contents/Resources/Game-FirstBuild"
          OLD_SOURCE="$RUNNER_TEMP/polytrack-v052"
          git clone --quiet --depth 1 https://github.com/htmlunblockedgames/polytrack-0.5.2-clean.git "$OLD_SOURCE"
          git -C "$OLD_SOURCE" fetch --quiet --depth 1 origin 2b6913f93aaccee4ab8f96a05755d98050db5463
          git -C "$OLD_SOURCE" checkout --quiet 2b6913f93aaccee4ab8f96a05755d98050db5463
          node "$OLD_SOURCE/scripts/run-tests.js"
          mkdir -p "$FIRST_GAME"
          rsync -a --exclude='.git/' --exclude='README.md' --exclude='API.md' --exclude='package.json' --exclude='scripts/' --exclude='.gitignore' "$OLD_SOURCE/" "$FIRST_GAME/"
          python3 - "$FIRST_GAME/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          html = p.read_text(encoding="utf-8")
          html = re.sub(r"""<script\b[^>]*src=["'][^"']*error_screen\.bundle\.js[^"']*["'][^>]*>\s*</script\s*>""", "", html, flags=re.I)
          html = re.sub(r"""<script\b[^>]*src=["']https://www\.googletagmanager\.com/gtag/js[^"']*["'][^>]*>\s*</script\s*>""", "", html, flags=re.I)
          html = re.sub(r"""<script\b[^>]*>.*?gtag\(\s*["']config["'].*?</script\s*>""", "", html, flags=re.I|re.S)
          p.write_text(html, encoding="utf-8")
          if re.search(r"""<script\b[^>]*src=["'][^"']*error_screen\.bundle\.js""", html, re.I):
              raise SystemExit("PolyTrack 0.5.2 error popup script still present")
          if 'googletagmanager' in html or 'G-TE23LLQE9F' in html:
              raise SystemExit("Analytics snippet still present in PolyTrack 0.5.2 HTML")
          PY
          test -s "$FIRST_GAME/index.html"
          test -s "$FIRST_GAME/main.bundle.js"
          test -s "$FIRST_GAME/simulation_worker.bundle.js"
          test -s "$FIRST_GAME/lib/ammo.wasm.wasm"
          test -s "$FIRST_GAME/lib/ammo.wasm.js"
          test -s "$FIRST_GAME/lib/draco/draco_decoder.wasm"
          test -s "$FIRST_GAME/lib/draco/draco_wasm_wrapper.js"
          grep -q '"rE":"0.5.2"' "$FIRST_GAME/main.bundle.js"
          test -s "$GAME/index.html"
          test -s "$GAME/main.bundle.js"
          test -s "$GAME/simulation_worker.bundle.js"
          test -s "$GAME/polytrack_physics.wasm"
          test -s "$GAME/lib/draco/draco_decoder.wasm"
          test -s "$GAME/lib/draco/draco_wasm_wrapper.js"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0.zip
          test -s PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0.zip
          python3 - PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0.zip <<'PY'
          import sys, zipfile
          archive = sys.argv[1]
          expected = (
              "Contents/Resources/Game/index.html",
              "Contents/Resources/Game/main.bundle.js",
              "Contents/Resources/Game/simulation_worker.bundle.js",
              "Contents/Resources/Game/polytrack_physics.wasm",
              "Contents/Resources/Game/lib/draco/draco_decoder.wasm",
              "Contents/Resources/Game/lib/draco/draco_wasm_wrapper.js",
              "Contents/Resources/Game-FirstBuild/index.html",
              "Contents/Resources/Game-FirstBuild/main.bundle.js",
              "Contents/Resources/Game-FirstBuild/simulation_worker.bundle.js",
              "Contents/Resources/Game-FirstBuild/lib/ammo.wasm.wasm",
              "Contents/Resources/Game-FirstBuild/lib/draco/draco_decoder.wasm",
          )
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              names = z.namelist()
              for suffix in expected:
                  matches = [name for name in names if name.endswith(suffix)]
                  if not matches:
                      raise SystemExit(f"Missing Mac artifact asset: {suffix}")
                  print("Verified:", matches[0])
          PY
          ls -lh PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0.zip

      - name: Upload native macOS app
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0
          path: PolyTrack-macOS-Monterey-Intel-v0.5.2-and-v0.6.0.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-Offline-v0.6.0-unsigned-IPA
          path: PolyTrack-Offline-v0.6.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-iOS-Simulator-v0.6.0
          path: PolyTrack-iOS-Simulator-v0.6.0.zip
          if-no-files-found: error
          retention-days: 14
