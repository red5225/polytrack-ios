name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download and prepare bundled PolyTrack v0.5.0
        run: bash scripts/fetch-polytrack.sh

      - name: Verify bundled game files
        run: |
          test -s PolyTrackIOS/Game/index.html
          test -s PolyTrackIOS/Game/main.bundle.js
          test -s PolyTrackIOS/Game/simulation_worker.bundle.js
          test -d PolyTrackIOS/Game/tracks
          test -d PolyTrackIOS/Game/models
          echo "Bundled game files:"
          du -sh PolyTrackIOS/Game
          find PolyTrackIOS/Game -type f | wc -l

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iPhone" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-iPhone/Build/Products/Release-iphoneos/PolyTrack.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Game/index.html"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/PolyTrack.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/PolyTrack-Offline-v0.5.0-unsigned.ipa" Payload)
          test -s PolyTrack-Offline-v0.5.0-unsigned.ipa
          unzip -l PolyTrack-Offline-v0.5.0-unsigned.ipa | grep -E 'Payload/PolyTrack.app/Game/(index.html|main.bundle.js|simulation_worker.bundle.js)'
          ls -lh PolyTrack-Offline-v0.5.0-unsigned.ipa

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PolyTrackIOS.xcodeproj \
            -scheme PolyTrackIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-Simulator/Build/Products/Release-iphonesimulator/PolyTrack.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PolyTrack-iOS-Simulator.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-Offline-v0.5.0-unsigned-IPA
          path: PolyTrack-Offline-v0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: PolyTrack-iOS-Simulator
          path: PolyTrack-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
